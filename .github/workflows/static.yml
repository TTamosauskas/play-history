name: Build and deploy Play History

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "audit/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build modular site
        run: python tools/build.py
      - name: Validate generated JavaScript
        run: |
          node --check _site/assets/entry.js
          node --check _site/assets/catalog.js
          node --check _site/assets/js/app.js
          node --check _site/assets/js/services.js
          node --check _site/assets/js/player.js
          node --check _site/assets/js/bootstrap.js
      - name: Smoke test year search
        run: node tools/smoke_runtime.js
      - name: Verify direct boot artifact
        run: |
          test -s _site/index.html
          test -s _site/assets/catalog.js
          test -s _site/assets/catalog.json
          test -s _site/assets/entry.js
          test -s _site/assets/styles.css
          grep -q 'assets/entry.js?v=' _site/index.html
          grep -q 'assets/catalog.js?v=' _site/index.html
          grep -q 'assets/js/player.js?v=' _site/index.html
          ! grep -q 'assets/loader.js' _site/index.html
      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
