name: Validate Play History

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "audit/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate 1900s Contexto audit
        run: python tools/audit_context_decade.py 1900 --validate-patches
      - name: Validate 1910s Contexto audit
        run: python tools/audit_context_decade.py 1910 --validate-patches
      - name: Validate 1920s Contexto audit
        run: python tools/audit_context_decade.py 1920 --validate-patches
      - name: Validate 1930s Contexto audit
        run: python tools/audit_context_decade.py 1930 --validate-patches
      - name: Validate 1940s Contexto audit
        run: python tools/audit_context_decade.py 1940 --validate-patches
      - name: Validate 1950s Contexto audit
        run: python tools/audit_context_decade.py 1950 --validate-patches
      - name: Validate 1960s Contexto audit
        run: python tools/audit_context_decade.py 1960 --validate-patches
      - name: Validate 1970s Contexto audit
        run: python tools/audit_context_decade.py 1970 --validate-patches
      - name: Validate curated addition packages
        run: python tools/validate_additions.py
      - name: Build modular site
        run: python tools/build.py
      - name: Validate generated JavaScript
        run: |
          node --check assets/catalog-runtime.js
          node --check _site/assets/entry.js
          node --check _site/assets/catalog.js
          node --check _site/assets/js/app.js
          node --check _site/assets/js/services.js
          node --check _site/assets/js/player.js
          node --check _site/assets/js/bootstrap.js
      - name: Smoke test year search
        run: node tools/smoke_runtime.js
      - name: Verify v6.33.0 player UX
        run: |
          test -s index.html
          test -s assets/catalog-runtime.js
          test -s assets/source/services/09.part
          test -s tools/patches/additions_1920s.json
          test -s tools/patches/additions_1930s_a.json
          test -s tools/patches/additions_1930s_b.json
          test -s tools/patches/additions_1930s_c.json
          test -s tools/patches/additions_1930s_d.json
          test -s tools/patches/additions_1930s_research.json
          test -s tools/patches/additions_1940s.json
          test -s tools/patches/additions_1940s_research.json
          test -s tools/patches/additions_1950s.json
          test -s tools/patches/additions_1950s_research.json
          test -s tools/patches/additions_1960s.json
          test -s tools/patches/additions_1960s_research.json
          test -s tools/patches/additions_1970s.json
          test -s tools/patches/additions_1970s_research.json
          test -s tools/patches/additions_1980s.json
          test -s tools/patches/additions_1980s_research.json
          test -s tools/patches/additions_1990s.json
          test -s tools/patches/additions_1990s_research.json
          test -s tools/patches/additions_2000s.json
          test -s tools/patches/additions_2010s.json
          test -s tools/patches/additions_2020s.json
          test -s tools/validate_additions.py
          test -s _site/assets/catalog.js
          test -s _site/assets/catalog.json
          test -s _site/assets/entry.js
          test -s _site/assets/styles.css
          grep -q 'assets/catalog-runtime.js?v=6.33.0' index.html
          grep -q 'additions_1920s.json' assets/catalog-runtime.js
          grep -q 'additions_1930s_a.json' assets/catalog-runtime.js
          grep -q 'additions_1930s_b.json' assets/catalog-runtime.js
          grep -q 'additions_1930s_c.json' assets/catalog-runtime.js
          grep -q 'additions_1930s_d.json' assets/catalog-runtime.js
          grep -q 'additions_1930s_research.json' assets/catalog-runtime.js
          grep -q 'additions_1940s.json' assets/catalog-runtime.js
          grep -q 'additions_1940s_research.json' assets/catalog-runtime.js
          grep -q 'additions_1950s.json' assets/catalog-runtime.js
          grep -q 'additions_1950s_research.json' assets/catalog-runtime.js
          grep -q 'additions_1960s.json' assets/catalog-runtime.js
          grep -q 'additions_1960s_research.json' assets/catalog-runtime.js
          grep -q 'additions_1970s.json' assets/catalog-runtime.js
          grep -q 'additions_1970s_research.json' assets/catalog-runtime.js
          grep -q 'additions_1980s.json' assets/catalog-runtime.js
          grep -q 'additions_1980s_research.json' assets/catalog-runtime.js
          grep -q 'additions_1990s.json' assets/catalog-runtime.js
          grep -q 'additions_1990s_research.json' assets/catalog-runtime.js
          grep -q 'additions_2000s.json' assets/catalog-runtime.js
          grep -q 'additions_2010s.json' assets/catalog-runtime.js
          grep -q 'additions_2020s.json' assets/catalog-runtime.js
          grep -q 'validateAdditionPackages' assets/catalog-runtime.js
          grep -q 'id="appreciationLink"' index.html
          ! grep -q 'id="infoLink"' index.html
          grep -q 'services: 9' assets/catalog-runtime.js
          grep -q 'APPRECIATION_URL_TEMPLATE' assets/source/services/09.part
          grep -q 'appendContextSection' assets/source/services/08.part
          grep -q 'definitiveYoutubeFailure' assets/source/services/01.part
          grep -q 'const alternates' assets/source/player/02.part
          ! grep -q 'infoLink.addEventListener' assets/source/player/08.part
          grep -q 'context_1900s_' assets/catalog-runtime.js
          grep -q 'context_1910s_' assets/catalog-runtime.js
          grep -q 'context_1920s_' assets/catalog-runtime.js
          grep -q 'context_1930s_' assets/catalog-runtime.js
          grep -q 'context_1940s_' assets/catalog-runtime.js
          grep -q 'context_1950s_' assets/catalog-runtime.js
          grep -q 'context_1960s_' assets/catalog-runtime.js
          grep -q 'context_1970s_' assets/catalog-runtime.js
          grep -q 'context_1980s_' assets/catalog-runtime.js
          grep -q 'context_1990s_' assets/catalog-runtime.js
          ! grep -q 'assets/loader.js' index.html

# GitHub Pages is published from the main branch by the repository's
# native Pages workflow. This workflow validates the generated player only,
# avoiding a second deployment path competing with the branch-source site.
