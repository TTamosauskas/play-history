name: Validate Play History

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "audit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prepare 1930s release candidate
        run: python tools/prepare_1930s_release.py
      - name: Validate 1930s Contexto audit
        run: python tools/audit_context_decade.py 1930 --validate-patches
      - name: Validate 1940s Contexto audit
        run: python tools/audit_context_decade.py 1940 --validate-patches
      - name: Validate 1950s Contexto audit
        run: python tools/audit_context_decade.py 1950 --validate-patches
      - name: Validate 1960s Contexto audit
        run: python tools/audit_context_decade.py 1960 --validate-patches
      - name: Validate 1970s Contexto audit
        run: python tools/audit_context_decade.py 1970 --validate-patches
      - name: Build modular site
        run: python tools/build.py
      - name: Validate generated JavaScript
        run: |
          node --check assets/catalog-runtime.js
          node --check _site/assets/entry.js
          node --check _site/assets/catalog.js
          node --check _site/assets/js/app.js
          node --check _site/assets/js/services.js
          node --check _site/assets/js/player.js
          node --check _site/assets/js/bootstrap.js
      - name: Smoke test year search
        run: node tools/smoke_runtime.js
      - name: Verify curated build
        run: |
          test -s index.html
          test -s assets/catalog-runtime.js
          test -s _site/assets/catalog.js
          test -s _site/assets/catalog.json
          test -s _site/assets/entry.js
          test -s _site/assets/styles.css
          grep -q 'assets/catalog-runtime.js?v=6.18.0' index.html
          grep -q 'context_1930s_' assets/catalog-runtime.js
          grep -q 'context_1940s_' assets/catalog-runtime.js
          grep -q 'context_1950s_' assets/catalog-runtime.js
          grep -q 'context_1960s_' assets/catalog-runtime.js
          grep -q 'context_1970s_' assets/catalog-runtime.js
          grep -q 'context_1980s_' assets/catalog-runtime.js
          ! grep -q 'assets/loader.js' index.html
      - name: Upload 1930s release candidate
        uses: actions/upload-artifact@v4
        with:
          name: 1930s-release-candidate
          path: |
            tools/build.py
            assets/catalog-runtime.js
            index.html

# GitHub Pages is published from the main branch by the repository's
# native Pages workflow. This workflow validates the generated player only,
# avoiding a second deployment path competing with the branch-source site.
