name: Research YouTube candidates

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -q yt-dlp
      - name: Search pending recordings without media extraction
        shell: bash
        run: |
          set +e
          queries=(
            "Cootie Williams Swingin' Down the Lane"
            "Milt Buckner Why Don't You Do Right"
            "Peggy Lee The Thrill Is Gone From Yesterday's Kiss"
            "Johnny Gibbs Mack the Knife"
            "Wild Bill Davison Tin Roof Blues Stars of Jazz"
            "Jim Beebe Art Hodes Eddie Condon Tin Roof Blues"
          )
          for q in "${queries[@]}"; do
            echo "===== QUERY: $q ====="
            yt-dlp "ytsearch15:$q" --flat-playlist --ignore-errors --no-warnings --print '%(id)s | %(title)s | %(uploader)s | %(duration_string)s' || true
          done
      - name: Validate known candidates with YouTube oEmbed
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          groups = {
            "Cootie": "5nTdTY21dJ8 Lq0X5IzVXMM dyyCvlgnXTo QCl8fnw8O6k ctcwSm8wlQs fvXj_oaC8hU TW8LJFj2HSo a-3-El9O0K4 Bf3RVt_Hg38 8EOg030zibs".split(),
            "Milt": "0pocHn8mtwE kI787nlomUM vpcNz9MBpGM TmbdNUoIEBk 0oox9bJaGJ8 qdsFRI7xF6Q kHJ3RUJOvps rFsmypYL8KE Vetawl6C5AQ pd3vtMCyHP4".split(),
            "Peggy": "umgNyhq70Js ab7BvPZGwzM VYuNm1DJnGY Ou0pIytgZ4A DX8CTiriNe0 69zr-zqB-zc bJdmiG8mSI8 PSEPQyiDKR4 E67MV1lIgFs Zx06XNfDvk0".split(),
            "Johnny": "gKdDpnVs-hY EaIKN9OsdyI 82dPY0vBsRc".split(),
          }
          for group, ids in groups.items():
              print(f"===== OEMBED {group} =====")
              for video_id in ids:
                  url = "https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v=" + video_id
                  try:
                      with urllib.request.urlopen(url, timeout=10) as r:
                          data = json.load(r)
                      print(f"{video_id} | {data.get('title')} | {data.get('author_name')}")
                  except Exception as e:
                      print(f"{video_id} | ERROR | {type(e).__name__}: {e}")
          PY
