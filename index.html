<!doctype html>
<html lang="pt-BR" data-build="6.27.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="dns-prefetch" href="//www.youtube.com">
<link rel="dns-prefetch" href="//i.ytimg.com">
<title>Player Musical 800–2026 — v6.27.0</title>

<link rel="stylesheet" href="./assets/styles.css?v=6.22.0">
<script defer src="./assets/entry.js?v=6.22.0"></script>
<script defer src="./assets/catalog-runtime.js?v=6.27.0"></script>

</head>
<body>
<main class="app is-start-screen" id="app">
  <form class="year-form" id="yearForm" autocomplete="off">
    <div class="year-field">
      <input class="year-input" id="yearInput" type="number" min="800" max="2026" step="1"
             inputmode="numeric" aria-label="Ano" placeholder="" value="">
      <button class="year-picker-toggle" id="yearPickerBtn" type="button" aria-label="Escolher ano" title="Escolher ano">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4.5 9h15M5.5 5h13a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-12A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>
      </button>
    </div>
  </form>

  <section class="player-card" aria-live="polite" hidden>
    <div class="art" id="art">
      <div class="mode-tags" id="modeTags" aria-label="Modos ativos"></div>
      <img id="artImg" alt="">
      <div class="art-fallback" id="artFallback">
        <div class="art-initials" id="artInitials">—</div>
        <div class="art-copy">
          <div class="art-artist" id="artArtist">Escolha um ano</div>
          <div class="art-year" id="artYear">800–2026</div>
        </div>
      </div>
    </div>

    <div class="timeline" aria-label="Progresso da reprodução">
      <span class="timeline-time" id="currentTimeLabel">0:00</span>
      <input class="timeline-range" id="progressRange" type="range" min="0" max="1" step="0.1" value="0" disabled aria-label="Posição da faixa">
      <span class="timeline-time" id="durationLabel">0:00</span>
    </div>

    <div class="meta">
      <h1 class="title" id="trackTitle">Escolha um ano</h1>
      <p class="artist"><span id="trackArtist">Uma faixa principal será selecionada pelo catálogo.</span>
      <span class="year-label" id="trackYear"></span></p>
    </div>

    <div class="controls">
      <button class="control" id="prevBtn" type="button" aria-label="Faixa anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6V5zm12.5 1.2v11.6L9.5 12l9-5.8z"/></svg>
      </button>

      <button class="control play" id="playBtn" type="button" aria-label="Reproduzir">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7V5zm6 0h4v14h-4V5z"/></svg>
      </button>

      <button class="control" id="nextBtn" type="button" aria-label="Próxima faixa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2V5zM5.5 6.2v11.6l9-5.8-9-5.8z"/></svg>
      </button>
    </div>

    <div class="playback-modes" aria-label="Modos de reprodução">
      <button class="mode-control" id="repeatBtn" type="button" aria-label="Repetir faixa" aria-pressed="false" title="Repetir faixa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M3 11V9a4 4 0 0 1 4-4h13"/><path d="M7 22l-3-3 3-3"/><path d="M21 13v2a4 4 0 0 1-4 4H4"/><path d="M12 9v6"/><path d="M10.5 10.5 12 9l1.5 1.5"/></svg>
      </button>
      <button class="mode-control" id="decadeLockBtn" type="button" aria-label="Fixar década" aria-pressed="false" title="Fixar década">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M12 14v3"/></svg>
      </button>
      <button class="mode-control" id="shuffleBtn" type="button" aria-label="Ordem aleatória" aria-pressed="false" title="Ordem aleatória">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="m21 3-6.5 6.5a4 4 0 0 1-5.7 0L3 3.7"/><path d="M16 21h5v-5"/><path d="m21 21-6.5-6.5a4 4 0 0 0-5.7 0L3 20.3"/></svg>
      </button>
      <button class="mode-control catalog-control" id="catalogModeBtn" type="button" data-catalog-mode="international" aria-label="Catálogo internacional" title="Catálogo internacional">
        <span class="catalog-symbol" aria-hidden="true">🌐</span>
      </button>
    </div>

    <nav class="track-links" aria-label="Aprofundar a faixa">
      <button class="track-link" id="contextLink" type="button" hidden>Contexto</button>
      <a class="track-link" id="albumLink" hidden target="_blank" rel="noopener noreferrer" title="Abrir álbum no YouTube Music">Álbum</a>
      <button class="track-link" id="lyricsLink" type="button" hidden>Letra</button>
      <a class="track-link" id="appreciationLink" hidden target="_blank" rel="noopener noreferrer">Apreciação</a>
    </nav>
  </section>

  <div class="sr-status" id="status" role="status" aria-live="polite"></div>
</main>

<dialog class="year-picker-dialog" id="yearPickerDialog" aria-label="Escolher século e ano">
  <div class="year-wheel-shell">
    <div class="year-wheel-stage">
      <div class="year-wheel-selection" aria-hidden="true"></div>
      <div class="year-wheel" id="centuryWheel" role="listbox" aria-label="Século" tabindex="0"></div>
      <div class="year-wheel" id="yearWheel" role="listbox" aria-label="Ano" tabindex="0"></div>
    </div>
    <div class="year-wheel-actions">
      <button class="year-picker-action" id="yearPickerClose" type="button" aria-label="Fechar seletor" title="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button class="year-picker-action confirm" id="yearPickerConfirm" type="button" aria-label="Usar ano selecionado" title="Usar ano selecionado">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </button>
    </div>
  </div>
</dialog>

<dialog class="context-dialog" id="contextDialog" aria-labelledby="contextDialogTitle">
  <div class="context-shell">
    <header class="context-header">
      <div class="context-heading">
        <div class="context-kicker" id="contextDialogKicker"></div>
        <h2 class="context-title" id="contextDialogTitle"></h2>
        <p class="context-subtitle" id="contextDialogSubtitle"></p>
      </div>
      <button class="context-close" id="contextDialogClose" type="button" aria-label="Fechar" title="Fechar">
        <span aria-hidden="true">×</span>
      </button>
    </header>
    <div class="context-body" id="contextDialogBody"></div>
    <div class="context-actions" id="contextDialogActions"></div>
  </div>
</dialog>

<div class="music-frame" id="musicFrame" aria-hidden="true">
  <div id="ytPlayer0"></div>
  <div id="ytPlayer1"></div>
  <div id="ytPlayer2"></div>
  <div id="ytPlayer3"></div>
  <div id="ytPlayer4"></div>
</div>
</body>
</html>
