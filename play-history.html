<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Player Musical 800–2026</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d10;
  --panel:#11151a;
  --panel-2:#171c22;
  --text:#f2f5f7;
  --muted:#98a2ad;
  --line:rgba(255,255,255,.10);
  --accent:#f4f6f8;
  --shadow:0 30px 90px rgba(0,0,0,.45);
  --radius:28px;
  --side-gutter:clamp(10px,3vw,18px);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:0;overflow:hidden}
body{
  margin:0;
  height:100dvh;
  min-height:0;
  overflow:hidden;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 560px at 50% -120px,rgba(255,255,255,.085),transparent 62%),
    var(--bg);
  color:var(--text);
  display:grid;
  place-items:start center;
  padding-top:0;
  padding-right:calc(env(safe-area-inset-right) + var(--side-gutter));
  padding-bottom:max(6px,env(safe-area-inset-bottom));
  padding-left:calc(env(safe-area-inset-left) + var(--side-gutter));
}
button,input{font:inherit}
button{color:inherit}
.app{
  width:min(100%,460px);
  height:100dvh;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding-top:max(0px,env(safe-area-inset-top));
}

.app.is-start-screen{
  justify-content:center;
  padding-bottom:max(0px,env(safe-area-inset-bottom));
}
.app.is-start-screen > :not(.year-form){
  display:none!important;
}
.app.is-start-screen .year-form{
  width:min(100%,380px);
  align-self:center;
  margin:0;
}
.app.is-start-screen .year-input{
  min-height:86px;
  padding:18px 72px 18px 22px;
  border-radius:26px;
  text-align:center;
  font-size:clamp(36px,12vw,56px);
  line-height:1;
  letter-spacing:.035em;
  font-weight:820;
  font-variant-numeric:tabular-nums;
  box-shadow:0 24px 80px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035);
}
.app.is-start-screen .year-input::placeholder{
  color:rgba(242,245,247,.28);
  opacity:1;
}
.app.is-start-screen .year-picker-toggle{
  right:11px;
  width:52px;
  height:52px;
  border-radius:17px;
}
.app.is-start-screen .year-picker-toggle svg{width:24px;height:24px}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin:0 4px 18px;
}
.brand-title{
  font-size:14px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:750;
}
.brand-version{
  font-size:12px;
  color:var(--muted);
}
.year-form{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-bottom:8px;
  flex:0 0 auto;
}
.year-field{
  position:relative;
  min-width:0;
}
.year-input{
  width:100%;
  min-width:0;
  appearance:textfield;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 54px 14px 16px;
  outline:none;
  font-weight:700;
  font-size:17px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
.year-input::-webkit-outer-spin-button,
.year-input::-webkit-inner-spin-button{appearance:none;margin:0}
.year-input:focus{border-color:rgba(255,255,255,.32)}
.year-picker-toggle{
  position:absolute;
  right:7px;
  top:50%;
  translate:0 -50%;
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}
.year-picker-toggle:hover{background:rgba(255,255,255,.06);color:var(--text)}
.year-picker-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go{
  border:1px solid rgba(255,255,255,.14);
  background:var(--accent);
  color:#0b0d10;
  border-radius:18px;
  padding:0 18px;
  font-weight:800;
  cursor:pointer;
}
.year-picker-dialog{
  width:min(calc(100% - 28px),390px);
  border:1px solid rgba(255,255,255,.11);
  border-radius:28px;
  padding:0;
  background:rgba(13,16,20,.97);
  color:var(--text);
  box-shadow:0 30px 100px rgba(0,0,0,.72);
  max-height:calc(100dvh - 18px);
  overflow:hidden;
}
.year-picker-dialog::backdrop{background:rgba(3,5,7,.76);backdrop-filter:blur(7px)}
.year-wheel-shell{padding:20px 18px 14px}
.year-wheel-stage{
  --wheel-row:56px;
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);
  gap:14px;
  height:calc(var(--wheel-row) * 5);
  overflow:hidden;
  perspective:700px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 19%,#000 81%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 19%,#000 81%,transparent 100%);
}
.year-wheel-selection{
  position:absolute;
  z-index:0;
  left:0;
  right:0;
  top:50%;
  height:var(--wheel-row);
  transform:translateY(-50%);
  border-top:1px solid rgba(255,255,255,.10);
  border-bottom:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.035);
  border-radius:12px;
  pointer-events:none;
}
.year-wheel{
  position:relative;
  z-index:1;
  height:100%;
  overflow-y:auto;
  overscroll-behavior:contain;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  padding-block:calc(var(--wheel-row) * 2);
  touch-action:pan-y;
  outline:none;
}
.year-wheel::-webkit-scrollbar{display:none}
.year-wheel-item{
  height:var(--wheel-row);
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  font-size:21px;
  font-weight:650;
  letter-spacing:.015em;
  color:rgba(242,245,247,.34);
  transform:perspective(440px) rotateX(var(--wheel-rotate,0deg)) scale(var(--wheel-scale,.86));
  opacity:var(--wheel-opacity,.34);
  transition:opacity .12s ease,transform .12s ease,color .12s ease;
  cursor:pointer;
  user-select:none;
}
.year-wheel-item[data-distance="1"]{--wheel-rotate:17deg;--wheel-scale:.92;--wheel-opacity:.56}
.year-wheel-item[data-distance="-1"]{--wheel-rotate:-17deg;--wheel-scale:.92;--wheel-opacity:.56}
.year-wheel-item[data-distance="2"]{--wheel-rotate:31deg;--wheel-scale:.82;--wheel-opacity:.24}
.year-wheel-item[data-distance="-2"]{--wheel-rotate:-31deg;--wheel-scale:.82;--wheel-opacity:.24}
.year-wheel-item.is-selected{
  --wheel-rotate:0deg;
  --wheel-scale:1;
  --wheel-opacity:1;
  color:var(--text);
  font-size:25px;
  font-weight:790;
}
.year-wheel-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:14px;
}
.year-picker-action{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:999px;
  background:transparent;
  color:var(--muted);
  padding:0;
  cursor:pointer;
}
.year-picker-action:hover{color:var(--text);background:rgba(255,255,255,.055)}
.year-picker-action.confirm{background:rgba(255,255,255,.075);color:var(--text)}
.year-picker-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.player-card{
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 26%),var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 18px 10px;
  box-shadow:var(--shadow);
  overflow:hidden;
  touch-action:pan-y;
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto auto auto auto auto;
}
.art{
  width:min(100%,430px,48dvh);
  height:auto;
  aspect-ratio:1 / 1;
  min-height:0;
  align-self:center;
  justify-self:center;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:#1c2229;
  border:1px solid rgba(255,255,255,.08);
  isolation:isolate;
}
.art img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  background:#050607;
  display:none;
}
.art.has-image img{display:block}
.art-fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:24px;
  background:
    radial-gradient(circle at 82% 14%,hsla(var(--h2),72%,70%,.34),transparent 30%),
    radial-gradient(circle at 18% 82%,hsla(var(--h1),74%,64%,.40),transparent 38%),
    linear-gradient(145deg,hsl(var(--h1) 38% 20%),hsl(var(--h2) 34% 10%));
}
.art.has-image .art-fallback{display:none}
.mode-tags{
  position:absolute;
  z-index:5;
  top:10px;
  right:10px;
  max-width:calc(100% - 20px);
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:6px;
  pointer-events:none;
}
.mode-tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:4px 8px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:999px;
  background:rgba(7,9,11,.70);
  color:rgba(255,255,255,.91);
  box-shadow:0 5px 18px rgba(0,0,0,.18);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  font-size:10px;
  line-height:1;
  font-weight:760;
  letter-spacing:.025em;
  white-space:nowrap;
}
.timeline{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) 38px;
  align-items:center;
  gap:8px;
  padding:7px 3px 0;
  min-height:25px;
}
.timeline-time{
  color:var(--muted);
  font-size:10px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  text-align:center;
}
.timeline-range{
  width:100%;
  height:16px;
  margin:0;
  padding:0;
  appearance:none;
  background:transparent;
  cursor:pointer;
  --progress:0%;
}
.timeline-range:disabled{opacity:.34;cursor:default}
.timeline-range::-webkit-slider-runnable-track{
  height:3px;
  border-radius:99px;
  background:linear-gradient(to right,rgba(255,255,255,.72) 0 var(--progress),rgba(255,255,255,.18) var(--progress) 100%);
}
.timeline-range::-webkit-slider-thumb{
  appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  border:0;
  background:var(--accent);
  margin-top:-4.5px;
  box-shadow:0 0 0 3px rgba(255,255,255,.06);
}
.timeline-range::-moz-range-track{
  height:3px;
  border-radius:99px;
  background:rgba(255,255,255,.18);
}
.timeline-range::-moz-range-progress{
  height:3px;
  border-radius:99px;
  background:rgba(255,255,255,.72);
}
.timeline-range::-moz-range-thumb{
  width:12px;
  height:12px;
  border-radius:50%;
  border:0;
  background:var(--accent);
}
.art-initials{
  font-size:clamp(54px,17vw,86px);
  font-weight:900;
  letter-spacing:-.075em;
  line-height:.85;
  opacity:.94;
}
.art-copy{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:18px;
}
.art-artist{
  max-width:78%;
  font-weight:800;
  line-height:1.05;
  font-size:18px;
}
.art-year{
  font-size:13px;
  letter-spacing:.08em;
  font-weight:800;
  opacity:.72;
}
.meta{
  padding:12px 4px 5px;
  min-height:0;
  flex:0 0 auto;
}
.title{
  margin:0;
  font-size:clamp(18px,3.6vh,24px);
  line-height:1.08;
  letter-spacing:-.025em;
  font-weight:850;
}
.artist{
  margin:8px 0 0;
  color:var(--muted);
  font-size:15px;
  line-height:1.35;
}
.year-label{
  color:#d8dde2;
  font-weight:720;
}
.controls{
  display:grid;
  grid-template-columns:1fr 1.25fr 1fr;
  align-items:center;
  justify-items:center;
  gap:16px;
  padding:7px 20px 5px;
}
.control{
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--panel-2);
  cursor:pointer;
  transition:transform .16s ease,background .16s ease,border-color .16s ease;
}
.control:hover{background:#20262d;border-color:rgba(255,255,255,.18)}
.control:active{transform:scale(.96)}
.control:disabled{opacity:.32;cursor:default}
.control svg{width:26px;height:26px;fill:currentColor}
.control.play{
  width:74px;
  height:74px;
  background:var(--accent);
  color:#0b0d10;
  border-color:transparent;
}
.control.play:hover{background:#fff}
.playback-modes{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:3px 8px 5px;
}
.mode-control{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--panel-2);
  color:var(--muted);
  cursor:pointer;
  transition:transform .16s ease,background .16s ease,color .16s ease,border-color .16s ease;
}
.mode-control:hover{color:var(--text);background:#20262d;border-color:rgba(255,255,255,.18)}
.mode-control:active{transform:scale(.96)}
.mode-control.is-active{background:var(--accent);color:#0b0d10;border-color:transparent}
.mode-control svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.track-links{
  width:max-content;
  max-width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:8px 13px 9px;
  margin:10px auto 1px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:999px;
  background:rgba(255,255,255,.025);
}
.track-link{
  color:var(--muted);
  font-size:12px;
  font-weight:650;
  line-height:1;
  text-decoration:none;
  letter-spacing:.02em;
  transition:color .16s ease,opacity .16s ease,background .16s ease;
}
.track-link:hover{color:var(--text)}
.track-link[aria-disabled="true"]{opacity:.38;pointer-events:none}
.sr-status{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  padding:0!important;
  margin:-1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  border:0!important;
}
.music-frame{
  position:fixed;
  width:240px;
  height:240px;
  left:-10000px;
  top:0;
  opacity:.001;
  pointer-events:none;
  border:0;
  overflow:hidden;
}
.music-frame iframe{width:240px!important;height:240px!important;border:0!important}
.icon-pause{display:none}
.is-playing .icon-play{display:none}
.is-playing .icon-pause{display:block}
@media (max-width:430px){
  :root{--side-gutter:9px}
  .player-card{padding:10px 12px 8px;border-radius:24px}
  .art{border-radius:19px}
  .controls{padding-left:10px;padding-right:10px}
  .playback-modes{padding-left:2px;padding-right:2px;gap:12px}
  .mode-control{width:44px;height:44px;flex-basis:44px}
  .mode-control svg{width:20px;height:20px}
  .year-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-height:720px){
  .year-input{padding-top:10px;padding-bottom:10px}
  .year-picker-toggle{width:35px;height:35px}
  .meta{padding-top:8px;padding-bottom:3px}
  .artist{margin-top:5px;font-size:13px}
  .control{width:52px;height:52px}
  .control.play{width:62px;height:62px}
  .control svg{width:22px;height:22px}
  .mode-control{width:40px;height:40px;flex-basis:40px}
  .playback-modes{gap:10px;padding-top:1px;padding-bottom:3px}
  .track-links{margin-top:7px;padding:7px 12px 8px}
  .timeline{padding-top:4px;min-height:20px}
}
@media (max-height:620px){
  .timeline{grid-template-columns:minmax(0,1fr);padding-left:2px;padding-right:2px}
  .timeline-time{display:none}
}
@media (max-height:600px){
  .player-card{padding-top:8px}
  .meta{padding-top:5px}
  .title{font-size:17px}
  .artist{font-size:12px;line-height:1.2}
  .controls{padding-top:3px;padding-bottom:2px}
  .control{width:46px;height:46px}
  .control.play{width:54px;height:54px}
  .mode-control{width:36px;height:36px;flex-basis:36px}
  .mode-control svg{width:17px;height:17px}
  .track-links{margin-top:6px;padding:6px 11px 7px;gap:16px}
  .track-link{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<main class="app is-start-screen" id="app">
  <form class="year-form" id="yearForm" autocomplete="off">
    <div class="year-field">
      <input class="year-input" id="yearInput" type="number" min="800" max="2026" step="1"
             inputmode="numeric" aria-label="Ano" placeholder="" value="">
      <button class="year-picker-toggle" id="yearPickerBtn" type="button" aria-label="Escolher ano" title="Escolher ano">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4.5 9h15M5.5 5h13a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-12A1.5 1.5 0 0 1 5.5 5Z"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>
      </button>
    </div>
  </form>

  <section class="player-card" aria-live="polite" hidden>
    <div class="art" id="art">
      <div class="mode-tags" id="modeTags" aria-label="Modos ativos"></div>
      <img id="artImg" alt="">
      <div class="art-fallback" id="artFallback">
        <div class="art-initials" id="artInitials">—</div>
        <div class="art-copy">
          <div class="art-artist" id="artArtist">Escolha um ano</div>
          <div class="art-year" id="artYear">800–2026</div>
        </div>
      </div>
    </div>

    <div class="timeline" aria-label="Progresso da reprodução">
      <span class="timeline-time" id="currentTimeLabel">0:00</span>
      <input class="timeline-range" id="progressRange" type="range" min="0" max="1" step="0.1" value="0" disabled aria-label="Posição da faixa">
      <span class="timeline-time" id="durationLabel">0:00</span>
    </div>

    <div class="meta">
      <h1 class="title" id="trackTitle">Escolha um ano</h1>
      <p class="artist"><span id="trackArtist">Uma faixa principal será selecionada pelo catálogo.</span>
      <span class="year-label" id="trackYear"></span></p>
    </div>

    <div class="controls">
      <button class="control" id="prevBtn" type="button" aria-label="Faixa anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6V5zm12.5 1.2v11.6L9.5 12l9-5.8z"/></svg>
      </button>

      <button class="control play" id="playBtn" type="button" aria-label="Reproduzir">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7V5zm6 0h4v14h-4V5z"/></svg>
      </button>

      <button class="control" id="nextBtn" type="button" aria-label="Próxima faixa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2V5zM5.5 6.2v11.6l9-5.8-9-5.8z"/></svg>
      </button>
    </div>

    <div class="playback-modes" aria-label="Modos de reprodução">
      <button class="mode-control" id="repeatBtn" type="button" aria-label="Repetir faixa" aria-pressed="false" title="Repetir faixa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M3 11V9a4 4 0 0 1 4-4h13"/><path d="M7 22l-3-3 3-3"/><path d="M21 13v2a4 4 0 0 1-4 4H4"/><path d="M12 9v6"/><path d="M10.5 10.5 12 9l1.5 1.5"/></svg>

function stableHue(text, offset = 0){
  let h = 2166136261;
  for (let i = 0; i < text.length; i++){
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h + offset) % 360;
}

function initials(name){
  const clean = name.replace(/&/g, " ").replace(/\band\b/gi, " ").trim();
  const words = clean.split(/\s+/).filter(Boolean);
  if (!words.length) return "—";
  if (words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

function trackIdentity(track){
  return track?.youtubeId || `${track?.year}|${track?.artist}|${track?.title}`;
}

function indexForYear(year){
  const exact = CHRONOLOGICAL_CATALOG.findIndex(track => track.year === year);
  if (exact >= 0) return exact;

  let bestIndex = 0;
  let bestDistance = Infinity;
  let bestYear = CHRONOLOGICAL_CATALOG[0]?.year ?? MIN_YEAR;

  CHRONOLOGICAL_CATALOG.forEach((track, index) => {
    const distance = Math.abs(track.year - year);
    if (
      distance < bestDistance ||
      (distance === bestDistance && track.year < bestYear)
    ){
      bestDistance = distance;
      bestYear = track.year;
      bestIndex = index;
    }
  });

  return bestIndex;
}

function fisherYates(items){
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function trackDecade(track){
  return Math.floor(Number(track?.year || MIN_YEAR) / 10) * 10;
}

function historicalCenturyAnchor(year){
  const numericYear = Number(year);
  if (!Number.isFinite(numericYear) || numericYear >= 1900) return null;
  return Math.floor(numericYear / 100) * 100;
}

function isHistoricalCenturyAnchor(anchor){
  const numericAnchor = Number(anchor);
  return Number.isFinite(numericAnchor) && numericAnchor < 1900 && numericAnchor % 100 === 0;
}

function centuryRomanForAnchor(anchor){
  return romanNumeral(Math.floor(Number(anchor) / 100) + 1);
}

function trackLockAnchor(track){
  const year = Number(track?.year || MIN_YEAR);
  return historicalCenturyAnchor(year) ?? trackDecade(track);
}

function trackMatchesLockedPeriod(track, anchor){
  const year = Number(track?.year || MIN_YEAR);
  if (isHistoricalCenturyAnchor(anchor)) return year >= Number(anchor) && year <= Number(anchor) + 99;
  return trackDecade(track) === anchor;
}

function lockedPeriodLabel(anchor){
  if (isHistoricalCenturyAnchor(anchor)) return `século ${centuryRomanForAnchor(anchor)}`;
  return `década ${anchor}`;
}

function modeUniverseForTrack(track){
  if (!decadeLocked) return CHRONOLOGICAL_CATALOG;
  const anchor = lockedDecade ?? trackLockAnchor(track);
  lockedDecade = anchor;
  return CHRONOLOGICAL_CATALOG.filter(item => trackMatchesLockedPeriod(item, anchor));
}

function rebuildQueueAroundTrack(currentTrack){
  const fallback = currentTrack || CHRONOLOGICAL_CATALOG[0];
  const universe = modeUniverseForTrack(fallback);
  const currentId = trackIdentity(fallback);

  if (shuffleEnabled){
    const rest = universe.filter(track => trackIdentity(track) !== currentId);
    queue = [fallback, ...fisherYates(rest)];
    currentIndex = 0;
  } else {
    queue = universe.slice();
    const located = queue.findIndex(track => trackIdentity(track) === currentId);
    currentIndex = located >= 0 ? located : 0;
  }
}

function romanNumeral(value){
  const pairs = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let number = Math.max(1, Math.floor(Number(value) || 1));
  let result = "";
  for (const [amount, glyph] of pairs){
    while (number >= amount){
      result += glyph;
      number -= amount;
    }
  }
  return result;
}

function centuryForWheelYear(year){
  return Math.floor((Number(year) - 1) / 100) + 1;
}

function yearBoundsForCentury(century){
  const start = Math.max(MIN_YEAR, (Number(century) - 1) * 100 + 1);
  const end = Math.min(MAX_YEAR, Number(century) * 100);
  return {start, end};
}

function wheelItems(wheel){
  return [...wheel.querySelectorAll(".year-wheel-item")];
}

function updateWheelVisuals(wheel, selectedIndex){
  const items = wheelItems(wheel);
  items.forEach((item, index) => {
    const rawDistance = index - selectedIndex;
    const distance = Math.max(-2, Math.min(2, rawDistance));
    item.dataset.distance = String(distance);
    const selected = index === selectedIndex;
    item.classList.toggle("is-selected", selected);
    item.setAttribute("aria-selected", String(selected));
  });
}

function scrollWheelToIndex(wheel, index, behavior = "auto"){
  const top = Math.max(0, index) * WHEEL_ROW_HEIGHT;
  wheel.scrollTo({top, behavior});
  updateWheelVisuals(wheel, Math.max(0, index));
}

function populateCenturyWheel(){
  centuryWheel.replaceChildren();
  for (let century = MIN_CENTURY; century <= MAX_CENTURY; century++){
    const item = document.createElement("div");
    item.className = "year-wheel-item";
    item.role = "option";
    item.dataset.value = String(century);
    item.textContent = romanNumeral(century);
    item.addEventListener("click", () => {
      const index = century - MIN_CENTURY;
      scrollWheelToIndex(centuryWheel, index, "smooth");
    });
    centuryWheel.appendChild(item);
  }
}

function populateYearWheel(preferredYear = wheelYear, behavior = "auto"){
  const {start, end} = yearBoundsForCentury(wheelCentury);
  const suffix = ((Math.max(1, Number(preferredYear) || start) - 1) % 100) + 1;
  const candidate = (wheelCentury - 1) * 100 + suffix;
  wheelYear = Math.min(end, Math.max(start, candidate));

  yearWheel.replaceChildren();
  for (let year = start; year <= end; year++){
    const item = document.createElement("div");
    item.className = "year-wheel-item";
    item.role = "option";
    item.dataset.value = String(year);
    item.textContent = String(year);
    item.addEventListener("click", () => {
      scrollWheelToIndex(yearWheel, year - start, "smooth");
    });
    yearWheel.appendChild(item);
  }
  scrollWheelToIndex(yearWheel, wheelYear - start, behavior);
}

function syncCenturyWheelFromScroll(){
  const index = Math.max(0, Math.min(MAX_CENTURY - MIN_CENTURY, Math.round(centuryWheel.scrollTop / WHEEL_ROW_HEIGHT)));
  const nextCentury = MIN_CENTURY + index;
  updateWheelVisuals(centuryWheel, index);
  if (nextCentury !== wheelCentury){
    const previousYear = wheelYear;
    wheelCentury = nextCentury;
    populateYearWheel(previousYear, "auto");
  }
}

function syncYearWheelFromScroll(){
  const {start, end} = yearBoundsForCentury(wheelCentury);
  const count = Math.max(1, end - start + 1);
  const index = Math.max(0, Math.min(count - 1, Math.round(yearWheel.scrollTop / WHEEL_ROW_HEIGHT)));
  wheelYear = start + index;
  updateWheelVisuals(yearWheel, index);
}

function bindWheelInteraction(wheel, syncFn){
  wheel.addEventListener("scroll", () => {
    cancelAnimationFrame(wheelSyncFrame);
    wheelSyncFrame = requestAnimationFrame(syncFn);
  }, {passive:true});

  wheel.addEventListener("keydown", event => {
    if (!["ArrowUp","ArrowDown","PageUp","PageDown"].includes(event.key)) return;
    event.preventDefault();
    const multiplier = event.key.startsWith("Page") ? 3 : 1;
    const direction = event.key === "ArrowUp" || event.key === "PageUp" ? -1 : 1;
    const current = Math.round(wheel.scrollTop / WHEEL_ROW_HEIGHT);
    scrollWheelToIndex(wheel, current + direction * multiplier, "smooth");
  });
}

function renderYearPicker(){
  populateCenturyWheel();
  const centuryIndex = wheelCentury - MIN_CENTURY;
  scrollWheelToIndex(centuryWheel, centuryIndex, "auto");
  populateYearWheel(wheelYear, "auto");
}

function openYearPicker(){
  const inputYear = Number(yearInput.value);
  const baseYear = playerStarted && Number.isInteger(inputYear) && inputYear >= MIN_YEAR && inputYear <= MAX_YEAR
    ? inputYear
    : DEFAULT_PICKER_YEAR;
  wheelYear = baseYear;
  wheelCentury = Math.min(MAX_CENTURY, Math.max(MIN_CENTURY, centuryForWheelYear(baseYear)));

  if (!yearPickerDialog.open && typeof yearPickerDialog.showModal === "function") yearPickerDialog.showModal();

  // The wheel must be positioned after the dialog has layout dimensions.
  // Rendering it while the <dialog> is closed leaves scrollTop at zero in some browsers.
  requestAnimationFrame(() => {
    renderYearPicker();
    requestAnimationFrame(() => {
      const centuryIndex = wheelCentury - MIN_CENTURY;
      const {start} = yearBoundsForCentury(wheelCentury);
      centuryWheel.scrollTop = centuryIndex * WHEEL_ROW_HEIGHT;
      yearWheel.scrollTop = (wheelYear - start) * WHEEL_ROW_HEIGHT;
      updateWheelVisuals(centuryWheel, centuryIndex);
      updateWheelVisuals(yearWheel, wheelYear - start);
      centuryWheel.focus({preventScroll:true});
    });
  });
}

function confirmYearPicker(){
  syncCenturyWheelFromScroll();
  syncYearWheelFromScroll();
  yearInput.value = String(wheelYear);
  yearPickerDialog.close();
  selectYear(wheelYear, true);
}

bindWheelInteraction(centuryWheel, syncCenturyWheelFromScroll);
bindWheelInteraction(yearWheel, syncYearWheelFromScroll);

function normalizeSearchText(value){
  return String(value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

async function fetchJson(url, timeoutMs = 5000){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, {signal:controller.signal, mode:"cors", credentials:"omit"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } finally {
    clearTimeout(timeout);
  }
}

function wikipediaPageScore(page, track){
  const pageTitle = normalizeSearchText(page.title);
  const wantedTitle = normalizeSearchText(track.title);
  const wantedArtist = normalizeSearchText(track.artist);
  const description = normalizeSearchText(page.terms?.description?.join(" ") || "");
  let score = 0;

  if (pageTitle === wantedTitle) score += 12;
  else if (pageTitle.includes(wantedTitle)) score += 8;
  else if (wantedTitle && wantedTitle.includes(pageTitle)) score += 4;

  const artistTokens = wantedArtist.split(" ").filter(token => token.length > 3);
  score += Math.min(6, artistTokens.filter(token => description.includes(token) || pageTitle.includes(token)).length * 2);
  if (/\b(song|single|album|recording|composition)\b/.test(description)) score += 3;
  if (page.thumbnail?.source || page.original?.source) score += 2;
  return score;
}

async function wikipediaArtwork(track){
  const api = new URL("https://en.wikipedia.org/w/api.php");
  api.searchParams.set("action", "query");
  api.searchParams.set("format", "json");
  api.searchParams.set("origin", "*");
  api.searchParams.set("prop", "pageimages|pageterms");
  api.searchParams.set("piprop", "thumbnail|original");
  api.searchParams.set("pithumbsize", "1200");
  api.searchParams.set("pilicense", "any");
  api.searchParams.set("wbptterms", "description");

  const portraitHint = track.artworkMode === "composer_portrait" ? (track.artworkPageTitle || track.artist) : null;
  const hint = portraitHint || WIKIPEDIA_PAGE_HINTS[`${track.artist}|${track.title}`];
  if (hint){
    api.searchParams.set("titles", hint);
  } else {
    api.searchParams.set("generator", "search");
    api.searchParams.set("gsrnamespace", "0");
    api.searchParams.set("gsrlimit", "8");
    api.searchParams.set("gsrsearch", `${track.title} ${track.artist}`);
  }

  const data = await fetchJson(api.toString());
  const pages = Object.values(data?.query?.pages || {}).filter(page => page.thumbnail?.source || page.original?.source);
  if (!pages.length) return null;

  if (hint){
    const page = pages[0];
    return page.thumbnail?.source || page.original?.source || null;
  }

  pages.sort((a,b) => wikipediaPageScore(b, track) - wikipediaPageScore(a, track));
  const winner = pages[0];
  if (wikipediaPageScore(winner, track) < 8) return null;
  return winner.thumbnail?.source || winner.original?.source || null;
}

function commonsPageScore(page, track){
  const name = normalizeSearchText(page.title?.replace(/^File:/i, ""));
  const title = normalizeSearchText(track.title);
  const artist = normalizeSearchText(track.artist);
  let score = 0;
  if (name.includes(title)) score += 8;
  const artistTokens = artist.split(" ").filter(token => token.length > 3);
  score += Math.min(5, artistTokens.filter(token => name.includes(token)).length * 2);
  if (/\b(cover|sleeve|album|single|record|sheet music|label)\b/.test(name)) score += 3;
  if (page.imageinfo?.[0]?.thumburl || page.imageinfo?.[0]?.url) score += 2;
  return score;
}

async function commonsArtwork(track){
  const api = new URL("https://commons.wikimedia.org/w/api.php");
  api.searchParams.set("action", "query");
  api.searchParams.set("format", "json");
  api.searchParams.set("origin", "*");
  api.searchParams.set("generator", "search");
  api.searchParams.set("gsrnamespace", "6");
  api.searchParams.set("gsrlimit", "10");
  api.searchParams.set("gsrsearch", `${track.title} ${track.artist} cover`);
  api.searchParams.set("prop", "imageinfo");
  api.searchParams.set("iiprop", "url");
  api.searchParams.set("iiurlwidth", "1200");

  const data = await fetchJson(api.toString());
  const pages = Object.values(data?.query?.pages || {}).filter(page => page.imageinfo?.[0]);
  if (!pages.length) return null;
  pages.sort((a,b) => commonsPageScore(b, track) - commonsPageScore(a, track));
  const winner = pages[0];
  if (commonsPageScore(winner, track) < 8) return null;
  return winner.imageinfo[0].thumburl || winner.imageinfo[0].url || null;
}

async function resolvedArtworkCandidates(track){
  const key = trackIdentity(track);
  if (artworkCache.has(key)) return artworkCache.get(key);

  const candidates = [];
  if (track.artworkUrl) candidates.push(track.artworkUrl);

  const [wikipediaResult, commonsResult] = await Promise.allSettled([
    wikipediaArtwork(track),
    commonsArtwork(track)
  ]);

  if (wikipediaResult.status === "fulfilled" && wikipediaResult.value) candidates.push(wikipediaResult.value);
  if (commonsResult.status === "fulfilled" && commonsResult.value) candidates.push(commonsResult.value);

  if (track.youtubeId){
    const id = encodeURIComponent(track.youtubeId);
    candidates.push(`https://i.ytimg.com/vi/${id}/maxresdefault.jpg`);
    candidates.push(`https://i.ytimg.com/vi/${id}/hqdefault.jpg`);
  }

  const unique = [...new Set(candidates.filter(Boolean))];
  artworkCache.set(key, unique);
  return unique;
}

function renderArtwork(track){
  const token = ++artworkRenderToken;
  const seed = `${track.artist}|${track.title}|${track.year}`;
  art.style.setProperty("--h1", stableHue(seed, 0));
  art.style.setProperty("--h2", stableHue(seed, 137));
  artInitials.textContent = initials(track.artist);
  artArtist.textContent = track.artist;
  artYear.textContent = track.year;

  art.classList.remove("has-image");
  artImg.removeAttribute("src");
  artImg.alt = `${track.artist} — ${track.title}`;

  resolvedArtworkCandidates(track).then(candidates => {
    if (token !== artworkRenderToken) return;
    let candidateIndex = 0;

    const loadNextCandidate = () => {
      if (token !== artworkRenderToken) return;
      if (candidateIndex >= candidates.length){
        art.classList.remove("has-image");
        artImg.removeAttribute("src");
        return;
      }
      artImg.src = candidates[candidateIndex++];
    };

    artImg.onload = () => {
      if (token !== artworkRenderToken) return;
      art.classList.add("has-image");
    };
    artImg.onerror = () => {
      if (token !== artworkRenderToken) return;
      art.classList.remove("has-image");
      loadNextCandidate();
    };

    loadNextCandidate();
  }).catch(() => {
    if (token !== artworkRenderToken) return;
    art.classList.remove("has-image");
  });
}


function wikipediaPageUrl(page){
  if (page?.fullurl) return page.fullurl;
  if (page?.title) return `https://en.wikipedia.org/wiki/${encodeURIComponent(page.title.replaceAll(" ", "_"))}`;
  return null;
}

async function wikipediaExactPage(title){

function wikipediaDescription(page){
  return normalizeSearchText(page?.terms?.description?.join(" ") || "");
}

function coreTrackTitle(track){
  const raw = String(track?.title || "").trim();
  const afterColon = raw.includes(":") ? raw.split(":").slice(1).join(":").trim() : raw;
  return afterColon
    .replace(/[“”"']/g, "")
    .replace(/\s*[–—-]\s*(remaster(?:ed)?|mono|stereo|live|version).*$/i, "")
    .trim();
}

function significantTokens(value){
  return normalizeSearchText(value)
    .split(/\s+/)
    .filter(token => token.length > 2 && !["the","and","with","from","feat","major","minor"].includes(token));
}

function tokenOverlap(a, b){
  const aa = new Set(significantTokens(a));
  const bb = new Set(significantTokens(b));
  if (!aa.size || !bb.size) return 0;
  let common = 0;
  aa.forEach(token => { if (bb.has(token)) common += 1; });
  return common / Math.max(1, Math.min(aa.size, bb.size));
}

function wikipediaArtistMatches(page, track){
  const haystack = `${normalizeSearchText(page?.title)} ${wikipediaDescription(page)}`;
  return significantTokens(track.artist).filter(token => haystack.includes(token)).length;
}

function scoreWorkArticle(page, track){
  const pageTitle = normalizeSearchText(page?.title);
  const fullTitle = normalizeSearchText(track.title);
  const coreTitle = normalizeSearchText(coreTrackTitle(track));
  const desc = wikipediaDescription(page);
  let score = 0;

  if (pageTitle === fullTitle || pageTitle === coreTitle) score += 18;
  score += Math.round(Math.max(tokenOverlap(page?.title, track.title), tokenOverlap(page?.title, coreTrackTitle(track))) * 10);
  score += Math.min(6, wikipediaArtistMatches(page, track) * 2);

  if (/\b(song|single|composition|musical composition|aria|opera|symphony|concerto|sonata|oratorio|mass|anthem|march|waltz|quartet|quintet|suite|serenade|overture|prelude|passion|requiem)\b/.test(desc)) score += 8;
  if (/\balbum\b/.test(desc)) score -= 6;
  if (/\b(disambiguation|surname|given name)\b/.test(desc)) score -= 10;
  return score;
}

function scoreAlbumArticle(page, albumName, track){
  const title = normalizeSearchText(page?.title);
  const album = normalizeSearchText(albumName || "");
  const desc = wikipediaDescription(page);
  let score = 0;
  if (title === album) score += 16;
  score += Math.round(tokenOverlap(page?.title, albumName) * 9);
  score += Math.min(6, wikipediaArtistMatches(page, track) * 2);
  if (/\balbum\b/.test(desc)) score += 10;
  return score;
}

function scoreArtistArticle(page, track){
  const title = normalizeSearchText(page?.title);
  const artist = normalizeSearchText(track.artist);
  const desc = wikipediaDescription(page);
  let score = 0;
  if (title === artist) score += 20;
  score += Math.round(tokenOverlap(page?.title, track.artist) * 10);
  if (/\b(singer|musician|band|group|duo|composer|rapper|artist|orchestra|quartet|songwriter|pianist|violinist|conductor)\b/.test(desc)) score += 8;
  return score;
}

function geniusTitleScore(resultTitle, track){
  const core = coreTrackTitle(track);
  const normalizedResult = normalizeSearchText(resultTitle || "");
  const normalizedCore = normalizeSearchText(core);
  if (!normalizedResult || !normalizedCore) return 0;
  if (normalizedResult === normalizedCore) return 1;
  if (normalizedResult.includes(normalizedCore) || normalizedCore.includes(normalizedResult)) return 0.92;
  return tokenOverlap(resultTitle, core);
}

function geniusArtistScore(resultArtist, track){
  const normalizedResult = normalizeSearchText(resultArtist || "");
  const normalizedArtist = normalizeSearchText(track.artist || "");
  if (!normalizedResult || !normalizedArtist) return 0;
  if (normalizedResult === normalizedArtist) return 1;
  if (normalizedResult.includes(normalizedArtist) || normalizedArtist.includes(normalizedResult)) return 0.92;
  return tokenOverlap(resultArtist, track.artist);
}

function directGeniusLyricsUrl(candidate){
  if (!candidate) return null;
  let pathname = String(candidate.path || "").trim();
  if (!pathname && candidate.url){
    try {
      const parsed = new URL(candidate.url);
      if (!/(^|\.)genius\.com$/i.test(parsed.hostname)) return null;
      pathname = parsed.pathname;
    } catch (_) { return null; }
  }
  if (!pathname.startsWith("/")) pathname = `/${pathname}`;
  pathname = pathname.replace(/\/+$/, "");
  if (!/-lyrics$/i.test(pathname)) return null;
  if (/^\/(search|artists|albums|songs)(\/|$)/i.test(pathname)) return null;
  return `https://genius.com${pathname}`;
}

function geniusCandidateScore(candidate, track){
  const resultTitle = candidate?.meta?.title || "";
  const resultArtist = candidate?.meta?.primaryArtist?.name || candidate?.meta?.artists || "";
  const titleScore = geniusTitleScore(resultTitle, track);
  const artistScore = geniusArtistScore(resultArtist, track);
  const releaseYear = Number(candidate?.meta?.releaseDate?.year);
  let score = titleScore * 100 + artistScore * 38;

  if (Number.isFinite(releaseYear) && Number(track.year) >= 1900){
    const distance = Math.abs(releaseYear - Number(track.year));
    if (distance === 0) score += 12;
    else if (distance <= 2) score += 7;
    else if (distance <= 5) score += 3;
    else if (distance >= 15) score -= 12;
  }

  const versionText = normalizeSearchText([
    candidate?.meta?.title,
    candidate?.meta?.fullTitle,
    candidate?.path
  ].filter(Boolean).join(" "));
  if (/\btranslation|traducao|traduccion|romanized|romanization\b/.test(versionText)) score -= 30;
  if (/\bkaraoke|parody|cover|tribute|remix|sped up|slowed|reverb\b/.test(versionText)) score -= 24;
  if (/\blive\b/.test(versionText) && !/\blive\b/.test(normalizeSearchText(track.title))) score -= 10;
  return {score, titleScore, artistScore};
}

async function resolveGeniusMetadata(track){
  const key = trackIdentity(track);
  if (geniusMetadataCache.has(key)) return geniusMetadataCache.get(key);

  let result = null;
  try {
    const api = new URL("https://api.sv443.net/geniurl/search");
    api.searchParams.set("q", `${track.artist} - ${coreTrackTitle(track)}`);
    api.searchParams.set("threshold", "0.65");
    const data = await fetchJson(api.toString(), 6500);

    const candidates = Array.isArray(data?.all)
      ? data.all
      : (data?.top ? [data.top] : []);

    const ranked = candidates
      .map(candidate => {
        const directUrl = directGeniusLyricsUrl(candidate);
        const metrics = geniusCandidateScore(candidate, track);
        return {candidate, directUrl, ...metrics};
      })
      .filter(item => item.directUrl)
      .sort((a,b) => b.score - a.score);

    const best = ranked[0];
    const historic = Number(track.year) < 1900;
    const artistThreshold = historic ? 0.24 : 0.62;

    if (
      best &&
      best.titleScore >= 0.88 &&
      best.artistScore >= artistThreshold &&
      best.candidate?.lyricsState !== "unreviewed"
    ){
      const meta = best.candidate.meta || {};
      result = {
        id: best.candidate.id,
        url: best.directUrl,
        path: best.candidate.path || new URL(best.directUrl).pathname,
        title: meta.title || "",
        fullTitle: meta.fullTitle || "",
        artist: meta.primaryArtist?.name || meta.artists || "",
        releaseYear: Number(meta.releaseDate?.year) || null,
        lyricsState: best.candidate.lyricsState || null,
        album: null
      };
    }
  } catch (_) {}

  geniusMetadataCache.set(key, result);
  return result;
}

async function resolveGeniusAlbumName(metadata){
  if (!metadata?.id) return null;
  if (geniusAlbumCache.has(metadata.id)) return geniusAlbumCache.get(metadata.id);
  let albumName = null;
  try {
    const data = await fetchJson(`https://api.sv443.net/geniurl/album/${encodeURIComponent(metadata.id)}`, 5000);
    albumName = !data?.error && data?.matches > 0 ? (data?.album?.name || null) : null;
  } catch (_) {}
  geniusAlbumCache.set(metadata.id, albumName);
  return albumName;
}

function modernInstrumentalOverride(track){

function shouldHideLyrics(track, geniusMetadata = null){
  if (track.lyricsPolicy === "hide_instrumental") return true;
  if (track.lyricsPolicy === "show_if_verified") return false;
  if (modernInstrumentalOverride(track)) return true;

  const metadataText = normalizeSearchText([
    geniusMetadata?.title,
    geniusMetadata?.fullTitle,
    geniusMetadata?.path
  ].filter(Boolean).join(" "));
  if (/instrumental/.test(metadataText)) return true;

  const titleText = normalizeSearchText(track.title);
  if (/instrumental/.test(titleText)) return true;
  return false;
}

async function resolveWikipediaInfoUrl(track, geniusMetadata = null){
  const key = trackIdentity(track);
  if (wikipediaInfoCache.has(key)) return wikipediaInfoCache.get(key);

  let resolved = null;
  try {
    const workQueries = [
      `"${track.title}" "${track.artist}"`,
      `"${coreTrackTitle(track)}" "${track.artist}"`,
      `"${track.title}"`
    ];
    let workCandidates = [];
    for (const query of workQueries){
      const pages = await wikipediaSearchPages(query, 10);
      workCandidates.push(...pages);
    }
    const uniqueWorks = [...new Map(workCandidates.map(page => [page.pageid || page.title, page])).values()];
    uniqueWorks.sort((a,b) => scoreWorkArticle(b, track) - scoreWorkArticle(a, track));
    if (uniqueWorks[0] && scoreWorkArticle(uniqueWorks[0], track) >= 17){
      resolved = wikipediaPageUrl(uniqueWorks[0]);
    }

    if (!resolved){
      const isAnonymous = /^an[oô]nimo$/i.test(String(track.artist || ""));
      const preferredArtistTitle = isAnonymous ? "" : (track.artworkPageTitle || track.artist || "");
      if (preferredArtistTitle){
        const exactArtist = await wikipediaExactPage(preferredArtistTitle);
        if (exactArtist && scoreArtistArticle(exactArtist, track) >= 12){
          resolved = wikipediaPageUrl(exactArtist);
        } else {
          const artistPages = await wikipediaSearchPages(`"${preferredArtistTitle}"`, 8);
          artistPages.sort((a,b) => scoreArtistArticle(b, track) - scoreArtistArticle(a, track));
          if (artistPages[0] && scoreArtistArticle(artistPages[0], track) >= 14){
            resolved = wikipediaPageUrl(artistPages[0]);
          }
        }
      }
    }

    if (!resolved && track.movementPageTitle){
      const exactMovement = await wikipediaExactPage(track.movementPageTitle);
      if (exactMovement && scoreMovementArticle(exactMovement, track) >= 10){
        resolved = wikipediaPageUrl(exactMovement);
      } else {
        const movementPages = await wikipediaSearchPages(`"${track.movementPageTitle}"`, 6);
        movementPages.sort((a,b) => scoreMovementArticle(b, track) - scoreMovementArticle(a, track));
        if (movementPages[0] && scoreMovementArticle(movementPages[0], track) >= 12){
          resolved = wikipediaPageUrl(movementPages[0]);
        }
      }
    }
  } catch (_) {}

  wikipediaInfoCache.set(key, resolved);
  return resolved;
}

function hideTrackLink(link){
  link.hidden = true;
  link.removeAttribute("href");
  link.setAttribute("aria-disabled", "true");
}

function showTrackLink(link, url){
  if (!url) return hideTrackLink(link);
  link.href = url;
  link.hidden = false;
  link.setAttribute("aria-disabled", "false");
}

function googleLyricsSearchUrl(track){
  const query = `${track.artist} ${track.title} lyrics`;
  return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
}

function songfactsSlug(value){
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[’'“”"`´]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-');
}

function songfactsTriviaSearchUrl(track){
  const artistSlug = songfactsSlug(track.artist);
  const titleSlug = songfactsSlug(track.title);
  if (!artistSlug || !titleSlug) return null;
  return `https://www.songfacts.com/facts/${artistSlug}/${titleSlug}`;
}

function queueSupportsPlaylist(){
  return queue.every(track => Boolean(track?.youtubeId));
}

function effectivePlaybackEngine(){
  return playbackEngine === "playlist" && queueSupportsPlaylist() ? "playlist" : "legacy";
}

function youtubeQueriesForTrack(track){
  const values = [
    track?.youtubeQuery,
    `${track?.artist || ""} ${track?.title || ""}`.trim(),
    `${track?.artworkPageTitle || track?.artist || ""} ${coreTrackTitle(track)}`.trim()
  ].filter(Boolean);
  return [...new Set(values)];
}

function youtubeCandidateScore(candidate, track){
  const title = candidate?.title || "";
  const author = candidate?.author || candidate?.uploader || "";
  let score = 0;
  score += Math.round(Math.max(tokenOverlap(title, track.title), tokenOverlap(title, coreTrackTitle(track))) * 100);
  score += Math.round(Math.max(tokenOverlap(author, track.artist), tokenOverlap(author, track.artworkPageTitle || track.artist)) * 36);
  const text = normalizeSearchText(`${title} ${author}`);
  if (/(karaoke|cover|tribute|reaction|analysis|lesson|tutorial|slowed|sped up|reverb)/.test(text)) score -= 40;
  if (/live/.test(text) && !/live/.test(normalizeSearchText(track.title))) score -= 8;
  if (/official/.test(text)) score += 4;
  return score;
}

async function resolveTrackYoutubeId(track){
  if (!track) return null;
  if (track.youtubeId) return track.youtubeId;
  const key = trackIdentity(track);
  if (youtubeResolutionCache.has(key)) {
    track.youtubeId = youtubeResolutionCache.get(key);
    track.youtubeUrl = `https://www.youtube.com/watch?v=${track.youtubeId}`;
    return track.youtubeId;
  }
  if (youtubeResolutionInFlight.has(key)) return youtubeResolutionInFlight.get(key);

  const task = (async () => {
    let best = null;
    try {
      const queries = youtubeQueriesForTrack(track);
      for (const endpoint of INVIDIOUS_SEARCH_ENDPOINTS){
        for (const query of queries){
          try {
            const api = new URL(endpoint);
            api.searchParams.set("q", query);
            api.searchParams.set("type", "video");
            const data = await fetchJson(api.toString(), 7000);
            const candidates = (Array.isArray(data) ? data : []).slice(0, 8);
            for (const candidate of candidates){
              if (!candidate?.videoId) continue;
              const score = youtubeCandidateScore(candidate, track);
              if (!best || score > best.score) best = {score, videoId: candidate.videoId};
            }
            if (best && best.score >= 62) break;
          } catch (_) {}
        }
        if (best && best.score >= 62) break;
      }
    } catch (_) {}

    const resolvedId = best?.videoId || null;
    if (resolvedId){
      youtubeResolutionCache.set(key, resolvedId);
      track.youtubeId = resolvedId;
      track.youtubeUrl = `https://www.youtube.com/watch?v=${resolvedId}`;
      if (!track.youtubeMusicUrl) track.youtubeMusicUrl = track.youtubeUrl;
    }
    return resolvedId;
  })().finally(() => youtubeResolutionInFlight.delete(key));

  youtubeResolutionInFlight.set(key, task);
  return task;
}

function resolvePreloadWindowVideoIds(){
  if (!queue.length) return;
  for (const offset of PRELOAD_OFFSETS){
    const track = queue[relativeQueueIndex(currentIndex, offset)];
    if (!track || track.youtubeId) continue;
    resolveTrackYoutubeId(track).then(() => {
      if (effectivePlaybackEngine() === "legacy") refreshPreloadWindow();
    }).catch(() => {});
  }
}

async function updateExternalLinks(track){
  const token = ++externalLinkRenderToken;
  hideTrackLink(infoLink);

  showTrackLink(lyricsLink, googleLyricsSearchUrl(track));
  showTrackLink(triviaLink, songfactsTriviaSearchUrl(track));

  const infoUrl = await resolveWikipediaInfoUrl(track, null);
  if (token !== externalLinkRenderToken) return;
  showTrackLink(infoLink, infoUrl);
}

function renderTrack(){
  const track = queue[currentIndex];
  if (!track) return;

  trackTitle.textContent = track.title;
  trackArtist.textContent = track.artist;
  trackYear.textContent = ` · ${track.year}`;
  renderArtwork(track);

  prevBtn.disabled = queue.length < 2;
  nextBtn.disabled = queue.length < 2;
  updateExternalLinks(track);

  const decadeText = decadeLocked && lockedDecade !== null ? ` · ${lockedPeriodLabel(lockedDecade)}` : "";
  setStatus(`${track.title} — ${track.artist}, ${track.year}${decadeText}`);
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setPlayingUI(isPlaying){
  playBtn.classList.toggle("is-playing", isPlaying);
  playBtn.setAttribute("aria-label", isPlaying ? "Pausar" : "Reproduzir");
}

function wrappedQueueIndex(index){
  if (!queue.length) return 0;
  return (index % queue.length + queue.length) % queue.length;
}

function relativeQueueIndex(baseIndex, offset){
  if (!queue.length) return 0;
  if (!decadeLocked) return wrappedQueueIndex(baseIndex + offset);

  const target = baseIndex + offset;
  if (target < 0) return 0;
  if (target >= queue.length) return target % queue.length;
  return target;
}

function playerSlotForVideo(videoId){
  if (!videoId) return -1;
  return loadedVideoIds.findIndex((id, slot) => id === videoId && readyPlayerSlots.has(slot));
}

function freePlayerSlot(reservedSlots = new Set()){
  for (let slot = 0; slot < PLAYER_POOL_SIZE; slot++){
    if (!readyPlayerSlots.has(slot)) continue;
    if (slot === activePlayerIndex) continue;
    if (reservedSlots.has(slot)) continue;
    return slot;
  }
  return -1;
}

function cueTrackOnSlot(slot, track){
  const targetPlayer = players[slot];
  if (!targetPlayer || !readyPlayerSlots.has(slot) || !track?.youtubeId) return;
  if (loadedVideoIds[slot] === track.youtubeId) return;

  try {
    targetPlayer.mute?.();
    targetPlayer.cueVideoById(track.youtubeId);
    loadedVideoIds[slot] = track.youtubeId;
  } catch (_) {}
}

function preloadArtworkAroundCurrent(){
  if (!queue.length) return;
  const seen = new Set();
  for (const offset of PRELOAD_OFFSETS){
    const track = queue[relativeQueueIndex(currentIndex, offset)];
    const key = trackIdentity(track);
    if (!track || seen.has(key)) continue;
    seen.add(key);
    resolvedArtworkCandidates(track).then(candidates => {
      const url = candidates?.[0];
      if (!url) return;
      const image = new Image();
      image.decoding = "async";
      image.src = url;
    }).catch(() => {});
  }
}

function refreshPreloadWindow(){
  if (!queue.length || !readyPlayerSlots.size) return;

  if (effectivePlaybackEngine() === "playlist") {
    for (let slot = 0; slot < PLAYER_POOL_SIZE; slot++){
      if (!readyPlayerSlots.has(slot) || slot === activePlayerIndex) continue;
      try { players[slot]?.mute?.(); } catch (_) {}
    }
    preloadArtworkAroundCurrent();
    return;
  }

  const desiredTracks = [];
  const seenIds = new Set();
  for (const offset of PRELOAD_OFFSETS){
    const track = queue[relativeQueueIndex(currentIndex, offset)];
    if (!track?.youtubeId || seenIds.has(track.youtubeId)) continue;
    seenIds.add(track.youtubeId);
    desiredTracks.push(track);
  }

  const reservedSlots = new Set();
  for (const track of desiredTracks){
    const slot = playerSlotForVideo(track.youtubeId);
    if (slot >= 0) reservedSlots.add(slot);
  }

  for (const track of desiredTracks){
    if (playerSlotForVideo(track.youtubeId) >= 0) continue;
    const slot = freePlayerSlot(reservedSlots);
    if (slot < 0) break;
    reservedSlots.add(slot);
    cueTrackOnSlot(slot, track);
  }

  for (let slot = 0; slot < PLAYER_POOL_SIZE; slot++){
    if (!readyPlayerSlots.has(slot) || slot === activePlayerIndex) continue;
    try { players[slot]?.mute?.(); } catch (_) {}
  }

  preloadArtworkAroundCurrent();
  resolvePreloadWindowVideoIds();
}

function choosePlayerForTrack(track){
  let slot = playerSlotForVideo(track?.youtubeId);
  if (slot >= 0) return slot;

  if (activePlayerIndex !== null && readyPlayerSlots.has(activePlayerIndex)){
    return activePlayerIndex;
  }

  for (const candidate of readyPlayerSlots) return candidate;
  return -1;
}

function playlistTracksForCurrent(){
  if (!queue.length) return [];
  const currentTrack = queue[currentIndex];
  if (!currentTrack) return [];
  if (repeatOne) return [currentTrack];

  if (playbackDirection < 0){
    const backwardToStart = queue.slice(0, currentIndex + 1).reverse();
    if (decadeLocked) return backwardToStart;
    return backwardToStart.concat(queue.slice(currentIndex + 1).reverse());
  }

  return queue.slice(currentIndex).concat(queue.slice(0, currentIndex));
}

function playlistShouldLoop(){
  if (repeatOne) return true;
  if (playbackDirection < 0 && decadeLocked) return false;
  return queue.length > 1;
}

function setPlaybackEngine(engine){
  playbackEngine = engine === "legacy" ? "legacy" : "playlist";
  document.documentElement.dataset.playbackEngine = playbackEngine;
}

function clearPlaylistWatchdog(){
  if (playlistWatchdog){
    clearTimeout(playlistWatchdog);
    playlistWatchdog = null;
  }
}

function legacyActivateCurrentTrack(autoplay = true, startSeconds = 0){
  const track = queue[currentIndex];
  if (!track) return;

  desiredPlaying = Boolean(autoplay);
  pendingPlay = Boolean(autoplay) && !readyPlayerSlots.size;
  setPlayingUI(Boolean(autoplay) && readyPlayerSlots.size > 0);

  if (!readyPlayerSlots.size){
    refreshPreloadWindow();
    return;
  }

  const previousPlayer = player;
  const previousSlot = activePlayerIndex;
  const targetSlot = choosePlayerForTrack(track);
  if (targetSlot < 0) return;

  if (previousPlayer && previousSlot !== targetSlot){
    try { previousPlayer.pauseVideo?.(); } catch (_) {}
    try { previousPlayer.mute?.(); } catch (_) {}
  }

  activePlayerIndex = targetSlot;
  player = players[targetSlot];
  playerReady = Boolean(player);

  try { player.unMute?.(); } catch (_) {}

  const alreadyLoaded = loadedVideoIds[targetSlot] === track.youtubeId;
  try {
    if (!alreadyLoaded || startSeconds > 0){
      loadedVideoIds[targetSlot] = track.youtubeId;
      const payload = {videoId: track.youtubeId, startSeconds: Math.max(0, Number(startSeconds) || 0)};
      if (autoplay) player.loadVideoById(payload);
      else player.cueVideoById(payload);
    } else if (autoplay){
      player.playVideo();
    } else {
      player.pauseVideo?.();
    }
  } catch (_) {}

  pendingPlay = false;
  refreshPreloadWindow();
}

function fallbackToLegacy(reason = "playlist indisponível"){
  if (playbackEngine === "legacy") return;
  const activeTime = (() => {
    try { return Math.max(0, Number(player?.getCurrentTime?.()) || 0); } catch (_) { return 0; }
  })();
  const wasPlaying = (() => {
    try { return player?.getPlayerState?.() === YT.PlayerState.PLAYING || desiredPlaying; } catch (_) { return desiredPlaying; }
  })();

  clearPlaylistWatchdog();
  setPlaybackEngine("legacy");
  setStatus(`Mecanismo de playlist indisponível (${reason}). Reprodução contínua mantida pelo modo compatível.`);
  legacyActivateCurrentTrack(Boolean(wasPlaying), activeTime);
}

function loadDirectionalPlaylist(autoplay = true, startSeconds = 0){
  if (!player || activePlayerIndex === null) return false;
  const tracks = playlistTracksForCurrent();
  const ids = tracks.map(track => track.youtubeId).filter(Boolean);
  const currentTrack = queue[currentIndex];
  if (!ids.length || !currentTrack?.youtubeId) return false;

  const serial = ++playlistLoadSerial;
  clearPlaylistWatchdog();

  try {
    loadedVideoIds[activePlayerIndex] = currentTrack.youtubeId;
    player.setLoop?.(playlistShouldLoop());
    if (autoplay){
      player.loadPlaylist(ids, 0, Math.max(0, Number(startSeconds) || 0));
      if (selectedTrackMustPlayFirstId === trackIdentity(currentTrack)){
        setTimeout(() => {
          try { player?.playVideoAt?.(0); } catch (_) {}
        }, 120);
      }
    } else {
      player.cuePlaylist(ids, 0, Math.max(0, Number(startSeconds) || 0));
    }
  } catch (error) {
    fallbackToLegacy("falha ao carregar a fila");
    return false;
  }

  playlistWatchdog = setTimeout(() => {
    if (serial !== playlistLoadSerial || effectivePlaybackEngine() !== "playlist" || !player) return;
    let playlistIds = [];
    let activeId = "";
    try { playlistIds = player.getPlaylist?.() || []; } catch (_) {}
    try { activeId = player.getVideoData?.()?.video_id || ""; } catch (_) {}
    const hasUsablePlaylist = ids.length <= 1
      ? activeId === currentTrack.youtubeId || playlistIds.length >= 1
      : playlistIds.length >= 2;
    if (!hasUsablePlaylist) fallbackToLegacy("fila interna não confirmada");
  }, 10000);

  return true;
}

function playlistActivateCurrentTrack(autoplay = true, startSeconds = 0){
  const track = queue[currentIndex];
  if (!track) return;

  desiredPlaying = Boolean(autoplay);
  pendingPlay = Boolean(autoplay) && !readyPlayerSlots.size;
  setPlayingUI(Boolean(autoplay) && readyPlayerSlots.size > 0);

  if (!readyPlayerSlots.size){
    refreshPreloadWindow();
    return;
  }

  let targetSlot = activePlayerIndex;
  if (targetSlot === null || !readyPlayerSlots.has(targetSlot)){
    targetSlot = choosePlayerForTrack(track);
  }
  if (targetSlot < 0 || targetSlot === null) return;

  if (player && activePlayerIndex !== targetSlot){
    try { player.pauseVideo?.(); } catch (_) {}
    try { player.mute?.(); } catch (_) {}
  }

  activePlayerIndex = targetSlot;
  player = players[targetSlot];
  playerReady = Boolean(player);
  try { player.unMute?.(); } catch (_) {}

  if (!loadDirectionalPlaylist(autoplay, startSeconds)) return;
  pendingPlay = false;
  refreshPreloadWindow();
}

async function activateCurrentTrack(autoplay = true, startSeconds = 0){
  const track = queue[currentIndex];
  if (!track) return;

  if (!track.youtubeId) {
    setStatus(`Resolvendo vídeo para ${track.title}…`);
    await resolveTrackYoutubeId(track);
  }

  if (!track.youtubeId){
    setStatus(`Vídeo não resolvido automaticamente para ${track.title}. Tente outra faixa ou abra a busca externa.`);
    setPlayingUI(false);
    return;
  }

  resolvePreloadWindowVideoIds();

  if (effectivePlaybackEngine() === "playlist"){
    playlistActivateCurrentTrack(autoplay, startSeconds);
  } else {
    legacyActivateCurrentTrack(autoplay, startSeconds);
  }
}

function rebuildActivePlaylistPreservingPosition(){
  if (effectivePlaybackEngine() !== "playlist" || !player || activePlayerIndex === null) return;
  let startSeconds = 0;
  let autoplay = desiredPlaying;
  try {
    startSeconds = Math.max(0, Number(player.getCurrentTime?.()) || 0);
    autoplay = player.getPlayerState?.() === YT.PlayerState.PLAYING || desiredPlaying;
  } catch (_) {}
  playlistActivateCurrentTrack(Boolean(autoplay), startSeconds);
}

function syncTrackFromActiveVideo(){
  if (effectivePlaybackEngine() !== "playlist" || !player || activePlayerIndex === null) return false;
  let videoId = "";
  try { videoId = player.getVideoData?.()?.video_id || ""; } catch (_) {}
  if (!videoId) return false;
  loadedVideoIds[activePlayerIndex] = videoId;
  const located = queue.findIndex(track => track.youtubeId === videoId);
  if (located < 0 || located === currentIndex) return located >= 0;
  currentIndex = located;
  renderTrack();
  preloadArtworkAroundCurrent();
  return true;
}

function formatPlaybackTime(seconds){
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  if (hours > 0) return `${hours}:${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
  return `${minutes}:${String(secs).padStart(2,"0")}`;
}

function updateProgressUI(){
  if (!player){
    progressRange.disabled = true;
    progressRange.max = "1";
    progressRange.value = "0";
    currentTimeLabel.textContent = "0:00";
    durationLabel.textContent = "0:00";
    return;
  }

  if (effectivePlaybackEngine() === "playlist" && !document.hidden) syncTrackFromActiveVideo();

  let duration = 0;
  let current = 0;
  try {
    duration = Number(player.getDuration?.()) || 0;
    current = Number(player.getCurrentTime?.()) || 0;
  } catch (_) {}

  if (duration > 0){
    progressRange.disabled = false;
    progressRange.max = String(duration);
    if (!progressDragging) progressRange.value = String(Math.min(duration, Math.max(0, current)));
    const shown = progressDragging ? (Number(progressRange.value) || 0) : current;
    progressRange.style.setProperty("--progress", `${Math.min(100, Math.max(0, shown / duration * 100))}%`);
    durationLabel.textContent = formatPlaybackTime(duration);
    if (!progressDragging) currentTimeLabel.textContent = formatPlaybackTime(current);
  } else {
    progressRange.disabled = true;
    progressRange.max = "1";
    if (!progressDragging) progressRange.value = "0";
    progressRange.style.setProperty("--progress", "0%");
    if (!progressDragging) currentTimeLabel.textContent = "0:00";
    durationLabel.textContent = "0:00";
  }
}

function selectIndex(index, autoplay = true){
  if (!queue.length) return;
  currentIndex = wrappedQueueIndex(index);
  renderTrack();
  activateCurrentTrack(autoplay);
}

function selectYear(rawYear, autoplay = false){
  const year = Number(rawYear);
  if (!Number.isInteger(year) || year < MIN_YEAR || year > MAX_YEAR){
    setStatus(`Escolha um ano entre ${MIN_YEAR} e ${MAX_YEAR}.`);
    return false;
  }

  ensurePlayerStarted();

  if (player){
    try { player.pauseVideo?.(); } catch (_) {}
  }

  const catalogIndex = indexForYear(year);
  const selectedTrack = CHRONOLOGICAL_CATALOG[catalogIndex] || CHRONOLOGICAL_CATALOG[0];

  // Keep exactly what the user entered in the field. If the catalog has no
  // track for that year, playback quietly resolves to the nearest available year.
  yearInput.value = year;
  yearInput.dataset.resolvedYear = String(selectedTrack.year);
  if (decadeLocked) lockedDecade = trackLockAnchor(selectedTrack);
  rebuildQueueAroundTrack(selectedTrack);
  selectedTrackMustPlayFirstId = trackIdentity(selectedTrack);
  selectedTrackGuardAttempts = 0;

  updateModeButtons();
  pendingPlay = Boolean(autoplay);
  desiredPlaying = Boolean(autoplay);
  setPlayingUI(Boolean(autoplay));
  renderTrack();
  activateCurrentTrack(Boolean(autoplay));
  return true;
}

function togglePlay(){
  if (!queue.length){
    if (!selectYear(yearInput.value, false)) return;
  }

  const wantedId = queue[currentIndex]?.youtubeId;
  const loadedId = activePlayerIndex === null ? null : loadedVideoIds[activePlayerIndex];

  if (!playerReady || !player || loadedId !== wantedId){
    pendingPlay = true;
    desiredPlaying = true;
    setPlayingUI(true);
    activateCurrentTrack(true);
    if (!readyPlayerSlots.size) setStatus("Conectando ao YouTube…");
    return;
  }

  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING){
    desiredPlaying = false;
    player.pauseVideo();
  } else {
    desiredPlaying = true;
    try { player.unMute?.(); } catch (_) {}
    player.playVideo();
  }
}

function nextTrack(autoplay = true, rememberDirection = true){
  if (rememberDirection) playbackDirection = 1;
  if (decadeLocked && currentIndex >= queue.length - 1){
    selectIndex(0, autoplay);
    return;
  }
  selectIndex(currentIndex + 1, autoplay);
}

function prevTrack(autoplay = true, rememberDirection = true){
  if (rememberDirection) playbackDirection = -1;
  if (decadeLocked && currentIndex <= 0){
    selectIndex(0, autoplay);
    return;
  }
  selectIndex(currentIndex - 1, autoplay);
}

function advanceInPlaybackDirection(autoplay = true){
  if (playbackDirection < 0) prevTrack(autoplay, false);
  else nextTrack(autoplay, false);
}

progressRange.addEventListener("pointerdown", () => { progressDragging = true; });
progressRange.addEventListener("input", () => {
  const target = Math.max(0, Number(progressRange.value) || 0);
  currentTimeLabel.textContent = formatPlaybackTime(target);
  const duration = Math.max(0, Number(progressRange.max) || 0);
  progressRange.style.setProperty("--progress", duration > 0 ? `${Math.min(100, Math.max(0, target / duration * 100))}%` : "0%");
  try { player?.seekTo?.(target, true); } catch (_) {}
});
function finishProgressDrag(){
  progressDragging = false;
  updateProgressUI();
}
progressRange.addEventListener("change", finishProgressDrag);
progressRange.addEventListener("pointerup", finishProgressDrag);
progressRange.addEventListener("pointercancel", finishProgressDrag);

yearForm.addEventListener("submit", e => {
  e.preventDefault();
  selectYear(yearInput.value, true);
});

playBtn.addEventListener("click", togglePlay);
prevBtn.addEventListener("click", () => prevTrack(true));
nextBtn.addEventListener("click", () => nextTrack(true));
repeatBtn.addEventListener("click", () => setRepeatOne(!repeatOne));
decadeLockBtn.addEventListener("click", () => setDecadeLock(!decadeLocked));
shuffleBtn.addEventListener("click", () => setShuffle(!shuffleEnabled));

function scheduleAutomaticYearSelection(){
  clearTimeout(yearInputTimer);
  yearInputTimer = setTimeout(() => {
    const raw = String(yearInput.value || "").trim();
    if (!/^\d{4}$/.test(raw)) return;
    const year = Number(raw);
    if (year >= MIN_YEAR && year <= MAX_YEAR) selectYear(year, true);
  }, 180);
}

yearInput.addEventListener("input", scheduleAutomaticYearSelection);
yearInput.addEventListener("change", scheduleAutomaticYearSelection);
yearInput.addEventListener("click", () => {
  if (!playerStarted) openYearPicker();
});

yearPickerBtn.addEventListener("click", openYearPicker);
yearPickerClose.addEventListener("click", () => yearPickerDialog.close());
yearPickerConfirm.addEventListener("click", confirmYearPicker);
yearPickerDialog.addEventListener("click", e => {
  if (e.target === yearPickerDialog) yearPickerDialog.close();
});
yearPickerDialog.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    e.preventDefault();
    confirmYearPicker();
  }
});

document.addEventListener("keydown", e => {
  if (!playerStarted) return;
  if (e.target === yearInput) return;
  if (e.code === "Space"){
    e.preventDefault();
    togglePlay();
  } else if (e.code === "ArrowLeft"){
    prevTrack(true);
  } else if (e.code === "ArrowRight"){
    nextTrack(true);
  }
});

playerCard.addEventListener("pointerdown", e => {
  if (e.target.closest("button,input,a")) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  swipePointerId = e.pointerId;
  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
});

playerCard.addEventListener("pointerup", e => {
  if (swipePointerId !== e.pointerId) return;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;
  swipePointerId = null;

  if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) <= Math.abs(dy) * 1.15) return;
  userHasSwipedDirection = true;
  if (dx < 0) nextTrack(true);
  else prevTrack(true);
});

playerCard.addEventListener("pointercancel", e => {
  if (swipePointerId === e.pointerId) swipePointerId = null;
});

function handlePlayerState(slot, event){
  const slotPlayer = players[slot];

  if (slot !== activePlayerIndex){
    if (event.data === YT.PlayerState.PLAYING){
      try { slotPlayer?.pauseVideo?.(); } catch (_) {}
      try { slotPlayer?.mute?.(); } catch (_) {}
    }
    return;
  }

  if (event.data === YT.PlayerState.PLAYING){
    desiredPlaying = true;
    setPlayingUI(true);
    if (effectivePlaybackEngine() === "playlist"){
      let activeId = "";
      try { activeId = slotPlayer?.getVideoData?.()?.video_id || ""; } catch (_) {}
      const selectedTrack = queue[currentIndex];
      const wantedSelectionId = selectedTrackMustPlayFirstId;
      const selectedYoutubeId = selectedTrack?.youtubeId || "";

      if (wantedSelectionId && selectedYoutubeId && activeId && activeId !== selectedYoutubeId && selectedTrackGuardAttempts < 2){
        selectedTrackGuardAttempts += 1;
        try { slotPlayer?.playVideoAt?.(0); } catch (_) {}
        return;
      }

      if (wantedSelectionId && (!activeId || activeId === selectedYoutubeId)){
        selectedTrackMustPlayFirstId = null;
        selectedTrackGuardAttempts = 0;
      }
      syncTrackFromActiveVideo();
    } else if (selectedTrackMustPlayFirstId){
      const selectedTrack = queue[currentIndex];
      let activeId = "";
      try { activeId = slotPlayer?.getVideoData?.()?.video_id || ""; } catch (_) {}
      if (!selectedTrack?.youtubeId || !activeId || activeId === selectedTrack.youtubeId){
        selectedTrackMustPlayFirstId = null;
        selectedTrackGuardAttempts = 0;
      }
    }
  } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.CUED){
    if (effectivePlaybackEngine() === "playlist") syncTrackFromActiveVideo();
    if (!desiredPlaying) setPlayingUI(false);
  } else if (event.data === YT.PlayerState.ENDED){
    desiredPlaying = true;

    if (effectivePlaybackEngine() === "playlist"){
      if (repeatOne){
        try { slotPlayer.playVideo?.(); } catch (_) {}
        return;
      }
      if (playbackDirection < 0 && decadeLocked){
        advanceInPlaybackDirection(true);
      }
      return;
    }

    if (repeatOne){
      try {
        slotPlayer.seekTo(0, true);
        slotPlayer.playVideo();
      } catch (_) {}
    } else {
      advanceInPlaybackDirection(true);
    }
  }
  updateProgressUI();
}

function handlePlayerError(slot, event){
  if (slot !== activePlayerIndex) return;
  desiredPlaying = true;
  setPlayingUI(false);

  if (effectivePlaybackEngine() === "playlist"){
    if (event.data === 2 || event.data === 5){
      fallbackToLegacy(`erro ${event.data}`);
      return;
    }
    setStatus(`A faixa retornou erro ${event.data}. A fila interna tentará a próxima entrada.`);
    try { player?.nextVideo?.(); } catch (_) {}
    clearTimeout(skipTimer);
    const failedId = queue[currentIndex]?.youtubeId;
    skipTimer = setTimeout(() => {
      let activeId = "";
      try { activeId = player?.getVideoData?.()?.video_id || ""; } catch (_) {}
      if (!activeId || activeId === failedId) advanceInPlaybackDirection(true);
    }, 1600);
    return;
  }

  setStatus(`A faixa retornou erro ${event.data}. Avançando para a próxima entrada da fila…`);
  clearTimeout(skipTimer);
  skipTimer = setTimeout(() => advanceInPlaybackDirection(true), 900);
}

function handleAutoplayBlocked(slot){
  if (slot !== activePlayerIndex) return;
  pendingPlay = false;
  desiredPlaying = false;
  setPlayingUI(false);
  setStatus("O navegador bloqueou a reprodução automática com áudio. Toque em play para liberar a reprodução.");
}

setPlaybackEngine(playbackEngine);
progressTimer = setInterval(updateProgressUI, 500);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden){
    syncTrackFromActiveVideo();
    updateProgressUI();
  }
});
window.addEventListener("pagehide", () => clearPlaylistWatchdog());

window.onYouTubeIframeAPIReady = function(){
  for (let slot = 0; slot < PLAYER_POOL_SIZE; slot++){
    players[slot] = new YT.Player(`ytPlayer${slot}`, {
      width: 240,
      height: 240,
      playerVars: {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        playsinline: 1,
        rel: 0,
        fs: 0
      },
      events: {
        onReady: event => {
          readyPlayerSlots.add(slot);
          try { event.target.mute?.(); } catch (_) {}

          if (playerStarted && activePlayerIndex === null){
            activateCurrentTrack(pendingPlay);
          } else if (playerStarted) {
            refreshPreloadWindow();
          }
        },
        onStateChange: event => handlePlayerState(slot, event),
        onError: event => handlePlayerError(slot, event),
        onAutoplayBlocked: () => handleAutoplayBlocked(slot)
      }
    });
  }
};

(function loadYouTubeAPI(){
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.async = true;
  document.head.appendChild(tag);
})();

updateModeButtons();
wheelYear = DEFAULT_PICKER_YEAR;
wheelCentury = centuryForWheelYear(DEFAULT_PICKER_YEAR);
setStatus(`Escolha um ano entre ${MIN_YEAR} e ${MAX_YEAR}.`);
if (matchMedia("(pointer:fine)").matches) requestAnimationFrame(() => yearInput.focus({preventScroll:true}));

if (location.protocol === "file:"){
  setStatus(`Escolha um ano entre ${MIN_YEAR} e ${MAX_YEAR}.`);
}
</script>
